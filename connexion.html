<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Service Artisans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/auth.css">
</head>
<body>
  <main class="carte">
    <div class="marque">
      <span class="point"></span>
      Service Artisans
    </div>

    <h1>Connexion</h1>
    <p class="sous-titre">Connectez-vous pour retrouver vos artisans et vos demandes en cours.</p>

    <div id="message" class="message" role="alert"></div>

    <button class="bouton secondaire" id="btnGoogle" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-right:4px;">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      Continuer avec Google
    </button>

    <div class="separateur"><span>ou avec votre e-mail</span></div>

    <form id="formConnexion" novalidate>
      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="nom@exemple.com" required>
        <div class="erreur"></div>
      </div>

      <div class="champ">
        <label for="motDePasse">Mot de passe</label>
        <div class="groupe-mot-de-passe">
          <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required>
          <button type="button" class="btn-toggle-mdp" aria-label="Afficher ou masquer le mot de passe">👁️</button>
        </div>
        <div class="erreur"></div>
      </div>

      <div class="options-connexion">
        <a href="#" id="lienMdpOublie">Mot de passe oublié ?</a>
      </div>

      <button class="bouton" type="submit">Se connecter</button>
    </form>

    <p class="pied">Nouveau sur la plateforme ? <a href="inscription.html">Créer un compte</a></p>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script type="module" src="js/firebase-auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const destination = urlParams.get("redirect") || "profil.html";

    if (utilisateurConnecte()) window.location.href = destination;

    const form = document.getElementById("formConnexion");
    const champ = id => document.getElementById(id);
    const message = document.getElementById("message");

    // Afficher / masquer le mot de passe
    document.querySelectorAll(".btn-toggle-mdp").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = btn.previousElementSibling;
        const estMdp = input.type === "password";
        input.type = estMdp ? "text" : "password";
        btn.textContent = estMdp ? "🙈" : "👁️";
      });
    });

    // Mot de passe oublié
    document.getElementById("lienMdpOublie").addEventListener("click", e => {
      e.preventDefault();
      const mail = champ("email").value.trim();
      if (!mail) {
        message.textContent = "Saisissez votre e-mail ci-dessus puis recliquez sur 'Mot de passe oublié'.";
        message.className = "message visible echec";
      } else {
        message.textContent = "Un lien de réinitialisation a été préparé pour " + mail + ".";
        message.className = "message visible reussite";
      }
    });

    const verifications = [
      lierValidation(champ("email"), Validation.email),
      lierValidation(champ("motDePasse"), v => Validation.obligatoire(v, "Le mot de passe"))
    ];

    form.addEventListener("submit", async e => {
      e.preventDefault();
      message.className = "message";
      if (!verifications.map(v => v()).every(Boolean)) return;

      const bouton = form.querySelector("button[type='submit']");
      bouton.disabled = true;
      bouton.textContent = "Connexion...";
      const res = await connecter(champ("email").value, champ("motDePasse").value);
      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      if (res.ok) {
        window.location.href = destination;
      } else {
        message.textContent = res.erreur;
        message.className = "message visible echec";
      }
    });

    document.getElementById("btnGoogle").addEventListener("click", async () => {
      message.className = "message";
      if (!window.connexionGoogle) {
        message.textContent = "Ouvrez le site via un serveur local (http://localhost…) pour tester la connexion Google.";
        message.className = "message visible echec";
        return;
      }
      const res = await window.connexionGoogle();
      if (res.ok) window.location.href = destination;
      else if (res.erreur) {
        message.textContent = res.erreur;
        message.className = "message visible echec";
      }
    });
  </script>
</body>
</html>
